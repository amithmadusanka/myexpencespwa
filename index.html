<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MenuMint</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-amber-50 text-neutral-800 font-sans min-h-screen pb-16">

    <!-- Top Navigation Bar -->
    <header class="bg-white shadow-sm border-b border-orange-100 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-orange-700">MenuMint</h1>
            <nav class="flex space-x-2">
                <button id="tab-creator" onclick="switchTab('creator')" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-orange-100 text-orange-800">Creator</button>
                <button id="tab-orders" onclick="switchTab('orders')" class="px-3 py-1.5 rounded-full text-sm font-semibold text-gray-600 hover:bg-gray-100">Orders</button>
                <button id="tab-history" onclick="switchTab('history')" class="px-3 py-1.5 rounded-full text-sm font-semibold text-gray-600 hover:bg-gray-100">History</button>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        
        <!-- ================= CREATOR VIEW ================= -->
        <div id="view-creator" class="">
            <!-- Keep your original Creator Form here -->
        </div>

        <!-- ================= ORDERS VIEW ================= -->
        <div id="view-orders" class="hidden">
            <div class="bg-white rounded-2xl p-6 shadow-md border border-orange-100 mb-6">
                <h2 class="text-lg font-bold text-orange-800 mb-4">Add New Order</h2>
                
                <form id="order-form" onsubmit="addOrder(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Order Name / Customer</label>
                        <input type="text" id="order-name" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Target Date</label>
                            <input type="date" id="order-date" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-orange-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Time Slot (Morning/Afternoon/Night)</label>
                            <select id="order-time" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-orange-500 outline-none">
                                <option value="Morning">Morning</option>
                                <option value="Afternoon">Afternoon</option>
                                <option value="Night">Night</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Delivery Location</label>
                        <input type="text" id="order-location" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-orange-500 outline-none" placeholder="e.g. Colombo, Sri Lanka">
                    </div>

                    <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2.5 rounded-lg transition">
                        Save Order
                    </button>
                </form>
            </div>

            <!-- Permission Card -->
            <div class="bg-amber-100 border border-amber-300 rounded-xl p-4 mb-6 flex justify-between items-center">
                <span class="text-xs text-amber-900 font-medium">Click to enable reminders 1 day before the event:</span>
                <button onclick="requestNotificationPermission()" class="bg-amber-800 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-amber-900">Enable Reminders</button>
            </div>

            <!-- Orders Table -->
            <div class="bg-white rounded-2xl p-6 shadow-md border border-orange-100">
                <h2 class="text-lg font-bold text-orange-800 mb-4">Upcoming Orders List</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-200 text-gray-600 text-sm">
                                <th class="pb-3">Order Name</th>
                                <th class="pb-3">Date</th>
                                <th class="pb-3">Time</th>
                                <th class="pb-3">Location</th>
                                <th class="pb-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body" class="divide-y divide-gray-100 text-sm">
                            <!-- JS Inserts rows here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ================= HISTORY VIEW ================= -->
        <div id="view-history" class="hidden">
            <!-- Keep your original History Table here -->
        </div>

    </main>

    <script src="app.js"></script>
    <script>
        // Registering SW for full PWA offline operation
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'));
        }
    </script>
</body>
</html>
