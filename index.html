<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MenuMint</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- PDF Library -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Navigation Header / Tabs -->
        <header class="border-b border-gray-200 mb-6">
            <nav class="flex space-x-4" aria-label="Tabs">
                <button onclick="switchTab('creator')" id="tab-creator" class="border-paprika text-paprika px-3 py-2 font-medium text-sm border-b-2 font-semibold cursor-pointer">
                    Menu Creator
                </button>
                <button onclick="switchTab('history')" id="tab-history" class="border-transparent text-gray-500 hover:text-gray-700 px-3 py-2 font-medium text-sm border-b-2 cursor-pointer">
                    Invoice & Quotation History
                </button>
            </nav>
        </header>

        <!-- Main Content Area -->
        <main>
            <!-- SECTION 1: Menu Creator View -->
            <div id="view-creator" class="block">
                <div class="bg-white p-6 rounded-xl shadow-xs border border-gray-100">
                    <h2 class="text-2xl font-serif text-ink mb-4">Create New Document</h2>
                    <!-- Insert your existing form fields/menu items inputs here -->
                    <p class="text-gray-500 text-sm mb-4">Generate custom invoices or quotations seamlessly.</p>
                    
                    <div class="flex gap-4">
                        <button onclick="saveToHistory('Invoice', 'INV-001', 'John Doe', '$150.00')" class="bg-paprika hover:bg-paprika-dark text-white px-4 py-2 rounded-lg text-sm font-medium cursor-pointer transition">
                            Mock Generate Invoice
                        </button>
                        <button onclick="saveToHistory('Quotation', 'QTN-402', 'Jane Smith', '$320.00')" class="bg-curry text-white px-4 py-2 rounded-lg text-sm font-medium cursor-pointer transition">
                            Mock Generate Quotation
                        </button>
                    </div>
                </div>
            </div>

            <!-- SECTION 2: History View (New Feature) -->
            <div id="view-history" class="hidden">
                <div class="bg-white p-6 rounded-xl shadow-xs border border-gray-100">
                    <h2 class="text-2xl font-serif text-ink mb-6">Document History</h2>
                    
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Doc Number</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Client Name</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Amount</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                                </tr>
                            </thead>
                            <tbody id="history-table-body" class="bg-white divide-y divide-gray-200 text-sm">
                                <!-- JavaScript dynamically populates rows here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
