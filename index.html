<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker PWA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
</head>
<body class="bg-gray-100 font-sans p-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-6 mt-6">
        <h2 class="text-2xl font-bold text-gray-800 text-center mb-4">💰 Ultimate Bank Tracker</h2>
        
        <!-- Tab Navigation -->
        <div class="flex border-b border-gray-200 mb-4">
            <button onclick="switchTab('sms-tab')" id="smsBtn" class="w-1/2 py-2 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 focus:outline-none cursor-pointer">SMS Input</button>
            <button onclick="switchTab('pdf-tab')" id="pdfBtn" class="w-1/2 py-2 text-center font-bold text-gray-500 focus:outline-none cursor-pointer">Upload PDF</button>
        </div>

        <!-- SMS Section -->
        <div id="sms-container" class="mb-6">
            <label class="block text-gray-600 text-sm font-semibold mb-2">Paste Bank SMS Here:</label>
            <textarea id="smsInput" rows="3" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g., Paid LKR 1,500.00 at Keells..."></textarea>
            <button onclick="processSMS()" class="w-full mt-2 bg-indigo-600 text-white font-bold py-2 px-4 rounded-xl hover:bg-indigo-700 transition cursor-pointer">Analyze SMS</button>
        </div>

        <!-- PDF Section (Standard Native Button Format) -->
        <div id="pdf-container" class="mb-6 hidden">
            <label class="block text-gray-600 text-sm font-semibold mb-2">Select Monthly Bank Statement (PDF):</label>
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center bg-gray-50">
                <!-- Standard visible upload input button -->
                <input type="file" id="pdfFile" accept=".pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer" onchange="processPDF()">
                <p id="pdfStatus" class="text-xs text-gray-400 mt-3">Supports BOC, Sampath, HNB statement PDFs</p>
            </div>
        </div>

        <hr class="border-gray-200 mb-6">

        <!-- Dashboard Analytics Summary -->
        <div class="bg-gray-50 p-4 rounded-xl mb-6">
            <h4 class="text-xs font-bold uppercase text-gray-500 mb-2">Monthly Analytics Summary</h4>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-red-100 p-3 rounded-lg">
                    <span class="text-xs text-red-700 font-semibold">Total Expenses</span>
                    <h3 id="totalDebit" class="text-lg font-bold text-red-700 mt-1">LKR 0.00</h3>
                </div>
                <div class="bg-green-100 p-3 rounded-lg">
                    <span class="text-xs text-green-700 font-semibold">Total Income</span>
                    <h3 id="totalCredit" class="text-lg font-bold text-green-700 mt-1">LKR 0.00</h3>
                </div>
            </div>
            <div class="mt-3 p-2 bg-white rounded-lg border border-gray-200 flex justify-between text-sm">
                <span class="text-gray-600 font-medium">Net Balance (Savings):</span>
                <span id="netBalance" class="font-bold text-gray-800">LKR 0.00</span>
            </div>
        </div>

        <!-- Transactions List -->
        <div>
            <div class="flex justify-between items-center mb-3">
                <h4 class="text-gray-700 font-bold">Transaction History</h4>
                <button onclick="clearAllData()" class="text-xs text-red-500 hover:underline cursor-pointer">Clear All</button>
            </div>
            <div id="transactionList" class="space-y-2 max-h-60 overflow-y-auto">
                <p class="text-gray-400 text-sm text-center py-4">No transactions added yet.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    </script>
</body>
</html>
